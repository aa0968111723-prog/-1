name: Release Android

# Production releases are cut from a tag, never from an ordinary push.
# Tagging is the deliberate act; main moving is not. A workflow_dispatch is
# kept for internal builds so the pipeline can be exercised without minting a
# public version.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      channel:
        description: 'internal = testable build, not advertised on the download page'
        required: true
        default: 'internal'
        type: choice
        options: [internal, production]

concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, checksum and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tag annotations are the release notes; a depth-1 checkout has none.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Resolve version and channel
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}."
              echo "::error::Bump package.json and run 'npm run sync:version' before tagging."
              exit 1
            fi
            CHANNEL=production
          else
            CHANNEL="${{ inputs.channel }}"
          fi
          # versionCode must match what sync-version.mjs derives, or phones will
          # refuse the upgrade even though the name looks newer.
          node scripts/sync-version.mjs --check
          VERSION_CODE=$(grep -oP 'versionCode \K\d+' android/app/build.gradle)
          echo "version=$VERSION"          >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL"          >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (code $VERSION_CODE) on channel $CHANNEL"

      - name: Build web assets + Capacitor sync
        run: npm run android:sync
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_RELEASE_MANIFEST_URL: ${{ secrets.RELEASE_MANIFEST_URL }}

      - name: Assemble APK
        working-directory: android
        # Unsigned release builds cannot be installed, so until a signing key
        # exists this pipeline ships the debug-signed artifact and labels it
        # honestly in the manifest. It is NOT presented as a production release
        # unless a keystore secret is configured (see docs/ANDROID_DISTRIBUTION.md).
        run: ./gradlew assembleDebug --stacktrace

      - name: Checksum and stage
        id: artifact
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          VERSION="${{ steps.meta.outputs.version }}"
          OUT="fintracker-${VERSION}.apk"
          mkdir -p release/android/"$VERSION"
          cp "$APK" release/android/"$VERSION"/"$OUT"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          echo "sha256=$SHA"   >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"    >> "$GITHUB_OUTPUT"
          echo "apkName=$OUT"  >> "$GITHUB_OUTPUT"
          echo "SHA-256 $SHA  ($SIZE bytes)"

      - name: Is publishing configured
        id: cfg
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${KEY:-}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build manifest
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES=$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}" 2>/dev/null || true)
          [ -n "$NOTES" ] || NOTES="版本 ${VERSION}"
          export NOTES
          node - <<'NODE' > "release/android/${{ steps.meta.outputs.version }}/manifest.json"
          const fs = require('fs');
          const manifest = {
            version: process.env.VERSION,
            versionCode: Number(process.env.VERSION_CODE),
            platform: 'android',
            minAndroid: Number(process.env.MIN_SDK),
            channel: process.env.CHANNEL,
            apkUrl: `${process.env.PUBLIC_BASE}/android/${process.env.VERSION}/${process.env.APK_NAME}`,
            sha256: process.env.SHA256,
            size: Number(process.env.SIZE),
            releasedAt: new Date().toISOString(),
            notes: process.env.NOTES,
            commit: process.env.GITHUB_SHA,
            // 'debug' until a real keystore exists. A debug APK is debuggable
            // and signed with the universally-known androiddebugkey, so anyone
            // can build an "update" Android will accept as the same app. The
            // download page shows this; the manifest must not let a debug
            // build pass silently as a normal production release.
            signing: process.env.SIGNING,
          };
          process.stdout.write(JSON.stringify(manifest, null, 2) + '\n');
          NODE
          cat "release/android/${VERSION}/manifest.json"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.versionCode }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          APK_NAME: ${{ steps.artifact.outputs.apkName }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
          SIZE: ${{ steps.artifact.outputs.size }}
          MIN_SDK: 24
          SIGNING: debug
          # Falls back to the project's own public bucket so a release still
          # produces a working URL before anyone configures the override.
          PUBLIC_BASE: ${{ secrets.RELEASE_PUBLIC_BASE || 'https://oylnzelynmbkozjlwsrd.supabase.co/storage/v1/object/public/app-releases' }}

      - name: Publish to Supabase Storage
        if: steps.cfg.outputs.publish == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          APK_NAME: ${{ steps.artifact.outputs.apkName }}
        run: |
          set -euo pipefail
          BUCKET=app-releases
          BASE="${SUPABASE_URL}/storage/v1/object"
          up() { # path, file, content-type
            curl -sS --fail-with-body -X POST "${BASE}/${BUCKET}/$1" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: $3" \
              -H "x-upsert: true" \
              --data-binary "@$2" > /dev/null
            echo "uploaded $1"
          }
          up "android/${VERSION}/${APK_NAME}" \
             "release/android/${VERSION}/${APK_NAME}" \
             "application/vnd.android.package-archive"
          up "android/${VERSION}/manifest.json" \
             "release/android/${VERSION}/manifest.json" \
             "application/json"
          # Only a production build becomes THE advertised version. An internal
          # build is uploaded and reachable, but latest.json keeps pointing at
          # the last production release, so the download page never hands a
          # test build to an ordinary visitor.
          if [ "${CHANNEL}" = "production" ]; then
            up "android/latest.json" \
               "release/android/${VERSION}/manifest.json" \
               "application/json"
            echo "latest.json now points at ${VERSION}"
          else
            echo "internal channel: latest.json left untouched"
          fi

      - name: Warn when publishing is not configured
        if: steps.cfg.outputs.publish != 'true'
        run: |
          echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not set, so nothing was published."
          echo "::warning::The APK and manifest are still attached as build artifacts."
          echo "::warning::See docs/ANDROID_DISTRIBUTION.md for the secrets this needs."

      # ------------------------------------------------------------------
      # Post-publish verification.
      #
      # A green workflow only proves the upload call returned 2xx. It does not
      # prove a stranger can actually download the APK, which is the only thing
      # the user cares about. So fetch what was just published the way a real
      # visitor would — anonymously, no auth header, over the public URL — and
      # check the bytes against the manifest.
      #
      # This runs on the runner because it has open network access; the
      # development environment this was authored in cannot reach *.supabase.co
      # at all, so verification here is the only place it can be real.
      # ------------------------------------------------------------------
      - name: Verify the published download works anonymously
        if: steps.cfg.outputs.publish == 'true' && steps.meta.outputs.channel == 'production'
        env:
          PUBLIC_BASE: ${{ secrets.RELEASE_PUBLIC_BASE || 'https://oylnzelynmbkozjlwsrd.supabase.co/storage/v1/object/public/app-releases' }}
          EXPECT_SHA: ${{ steps.artifact.outputs.sha256 }}
          EXPECT_SIZE: ${{ steps.artifact.outputs.size }}
          EXPECT_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          MANIFEST_URL="${PUBLIC_BASE}/android/latest.json"

          echo "GET $MANIFEST_URL"
          # Deliberately NO Authorization header: this must work for a stranger.
          code=$(curl -sS -o /tmp/latest.json -w '%{http_code}' "$MANIFEST_URL")
          echo "latest.json -> HTTP $code"
          [ "$code" = "200" ] || { echo "::error::latest.json is not publicly readable (HTTP $code)"; exit 1; }

          python3 - <<'NODE'
          import json, os, sys
          m = json.load(open('/tmp/latest.json'))
          for k in ('version','versionCode','platform','minAndroid','channel','apkUrl','sha256','size','releasedAt'):
              if k not in m:
                  print(f"::error::latest.json is missing required field {k}"); sys.exit(1)
          if m['channel'] != 'production':
              print(f"::error::channel is {m['channel']}, expected production"); sys.exit(1)
          if m['version'] != os.environ['EXPECT_VERSION']:
              print(f"::error::version {m['version']} != {os.environ['EXPECT_VERSION']}"); sys.exit(1)
          if m['sha256'] != os.environ['EXPECT_SHA']:
              print("::error::manifest sha256 does not match the APK that was just built"); sys.exit(1)
          print(f"manifest OK: {m['version']} code {m['versionCode']} channel {m['channel']}")
          print(m['apkUrl'])
          open('/tmp/apkurl','w').write(m['apkUrl'])
          NODE

          APK_URL=$(cat /tmp/apkurl)
          echo "GET $APK_URL"
          code=$(curl -sSL -o /tmp/downloaded.apk -w '%{http_code}' "$APK_URL")
          ctype=$(curl -sSLI -o /dev/null -w '%{content_type}' "$APK_URL")
          echo "apk -> HTTP $code, content-type: $ctype"
          [ "$code" = "200" ] || { echo "::error::APK is not publicly downloadable (HTTP $code)"; exit 1; }

          SIZE=$(stat -c%s /tmp/downloaded.apk)
          SHA=$(sha256sum /tmp/downloaded.apk | cut -d" " -f1)
          echo "downloaded: $SIZE bytes, sha256 $SHA"
          [ "$SIZE" -gt 0 ] || { echo "::error::downloaded APK is empty"; exit 1; }
          [ "$SIZE" = "$EXPECT_SIZE" ] || { echo "::error::size $SIZE != manifest $EXPECT_SIZE"; exit 1; }
          [ "$SHA" = "$EXPECT_SHA" ] || { echo "::error::sha256 mismatch: downloaded $SHA, manifest $EXPECT_SHA"; exit 1; }

          # An APK is a zip; if what came back is an XML error page or a JSON
          # 401 body, this is where it shows up rather than on a user's phone.
          file /tmp/downloaded.apk
          head -c 2 /tmp/downloaded.apk | grep -q 'PK' || { echo "::error::downloaded file is not a zip/APK"; exit 1; }

          {
            echo "### Android download verified"
            echo ""
            echo "| check | result |"
            echo "|---|---|"
            echo "| latest.json | HTTP 200 |"
            echo "| channel | production |"
            echo "| APK URL | HTTP 200 |"
            echo "| content-type | \`$ctype\` |"
            echo "| size | $SIZE bytes |"
            echo "| sha256 | \`$SHA\` |"
            echo "| matches manifest | yes |"
            echo ""
            echo "Anonymous download URL:"
            echo ""
            echo "\`$APK_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.meta.outputs.version }}
          path: release/android/${{ steps.meta.outputs.version }}/
          retention-days: 30
