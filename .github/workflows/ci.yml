name: CI

on:
  # Feature branches are covered by the pull_request trigger; listing them here
  # too would run every job twice on each push.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Version in sync
        # package.json is the single source of the version. If build.gradle has
        # drifted, a release would ship an APK whose versionCode phones refuse
        # to treat as an upgrade — catch it here, not at install time.
        run: npm run check:version
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify shared config asset in sync
        run: cmp shared/pet-shared-config.json android/app/src/main/assets/pet_shared_config.json
      - name: Workflows parse and their shell is valid
        # A workflow that does not parse is only discovered when you try to
        # use it — which for the release pipeline means at release time.
        run: node scripts/check-workflows.mjs
      - name: Supabase migrations are valid SQL
        # Cheap structural gate: migrations must exist, be numbered, and every
        # finance table must carry an RLS statement. A schema change that
        # forgets RLS is the one mistake that silently exposes another user's
        # ledger, so it fails the build rather than review.
        run: node scripts/check-migrations.mjs
      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  android:
    name: Android (unit tests, assembleDebug)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build web assets + Capacitor sync
        run: npm run android:sync
      - name: Android unit tests
        working-directory: android
        run: ./gradlew test --stacktrace
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # Lint runs after the APK is built and uploaded, so a lint regression
      # still leaves an installable artifact to test with while failing the job.
      - name: Android lint
        working-directory: android
        run: ./gradlew lintDebug --stacktrace
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.txt
          retention-days: 7
          if-no-files-found: ignore
